# Run with: go tool -modfile=tools/go.mod task <name>
version: "3"

env:
  # homedash is pure Go: no C toolchain needed, and binaries are static.
  CGO_ENABLED: "0"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMPOSE: docker compose -f .dev/compose.yaml
  LDFLAGS: -X github.com/unshade/homedash/cmd.Version={{.VERSION}}

tasks:
  default:
    cmds:
      - go tool -modfile=tools/go.mod task --list
    silent: true

  build:
    desc: Build the homedash binary into bin/
    sources: ["*.go", "cmd/**/*.go", "internal/**/*.go", go.mod, go.sum]
    generates: [bin/homedash]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/homedash .

  generate:
    desc: Run go generate (gomock mocks, ...)
    cmds:
      - go generate ./cmd/... ./internal/...

  test:
    desc: Run unit tests (no external dependencies)
    cmds:
      - go test . ./cmd/... ./internal/...

  test:integration:
    desc: Run unit + integration tests (needs Docker for testcontainers)
    cmds:
      - go test -tags integration . ./cmd/... ./internal/...

  serve:
    desc: Build and run the API on localhost:8080 (run `task db:up` first)
    deps: [build]
    cmds:
      - ./bin/homedash serve {{.CLI_ARGS}}

  db:up:
    desc: Start the dev PostgreSQL database
    cmds:
      - "{{.COMPOSE}} up -d --wait postgres"

  db:down:
    desc: Stop the dev PostgreSQL database (data is kept)
    cmds:
      - "{{.COMPOSE}} down"

  db:reset:
    desc: Stop the dev PostgreSQL database and delete its data
    prompt: This deletes all dev data. Continue?
    cmds:
      - "{{.COMPOSE}} down --volumes"

  cobra:add:
    desc: "Scaffold a new CLI command (e.g. task cobra:add -- groceries, or -- list -p groceriesCmd)"
    cmds:
      - go tool -modfile=tools/go.mod cobra-cli add --config .cobra.yaml {{.CLI_ARGS}}

  web:install:
    desc: Install frontend dependencies
    dir: web
    sources: [package.json, package-lock.json]
    cmds:
      - npm ci

  web:dev:
    desc: Run the Next.js dev server (proxies /api to the Go API)
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  web:build:
    desc: Build the frontend
    dir: web
    deps: [web:install]
    cmds:
      - npm run build

  web:lint:
    desc: Lint the frontend
    dir: web
    deps: [web:install]
    cmds:
      - npm run lint
