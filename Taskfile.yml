# Run with: go tool -modfile=tools/go.mod task <name>
version: "3"

env:
  # homedash is pure Go: no C toolchain needed, and binaries are static.
  CGO_ENABLED: "0"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMPOSE: docker compose -f .dev/compose.yaml
  TOOL: go tool -modfile=tools/go.mod
  # Our Go packages. Not ./...: web/node_modules contains a Go package.
  PKGS: . ./cmd/... ./internal/...
  # Packages measured by coverage, whichever package's tests exercise them.
  COVERPKG: ./cmd/...,./internal/...
  COVERDIR: "{{.ROOT_DIR}}/.coverage"
  # Packages that contain *_integration_test.go files.
  INTEGRATION_PKGS:
    sh: find cmd internal -name '*_integration_test.go' -exec dirname {} \; | sort -u | sed 's|^|./|' | tr '\n' ' '
  LDFLAGS: -X github.com/unshade/homedash/cmd.Version={{.VERSION}}

tasks:
  default:
    cmds:
      - go tool -modfile=tools/go.mod task --list
    silent: true

  build:
    desc: Build the homedash binary (frontend embedded) into bin/
    deps: [web:build]
    sources: ["*.go", "cmd/**/*.go", "internal/**/*.go", "internal/webui/dist/**", go.mod, go.sum]
    generates: [bin/homedash]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/homedash .

  dev:
    desc: Develop with live reload - database, Go server (air) and Vite dev server on http://localhost:5173
    cmds:
      - task: db:up
      - task: dev:servers

  dev:servers:
    internal: true
    deps: [dev:api, web:dev]

  dev:api:
    desc: Run the Go server and restart it on every Go change (air, config in .dev/air.toml)
    cmds:
      - "{{.TOOL}} air -c .dev/air.toml"

  generate:
    desc: Run go generate (gomock mocks, ...)
    cmds:
      - go generate ./cmd/... ./internal/...

  vet:
    desc: Run go vet (integration tests included)
    cmds:
      - go vet -tags integration {{.PKGS}}

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    cmds:
      - "{{.TOOL}} golangci-lint run {{.PKGS}}"

  lint:fix:
    desc: Run golangci-lint and apply automatic fixes (formatting, imports, ...)
    cmds:
      - "{{.TOOL}} golangci-lint run --fix {{.PKGS}}"

  vuln:
    desc: Check for known vulnerabilities in the code paths we call
    cmds:
      - "{{.TOOL}} govulncheck -tags integration {{.PKGS}}"

  check:
    desc: Run every pre-check (Go vet, lint, vuln; frontend lint, types, audit, API types; build)
    cmds:
      - task: vet
      - task: lint
      - task: vuln
      - task: web:lint
      - task: web:typecheck
      - task: web:audit
      - task: web:api:check
      - task: build

  test:
    desc: Run unit tests (no external dependencies), coverage in .coverage/unit
    cmds:
      - rm -rf {{.COVERDIR}}/unit && mkdir -p {{.COVERDIR}}/unit
      - go test -cover -coverpkg={{.COVERPKG}} {{.PKGS}} -args -test.gocoverdir={{.COVERDIR}}/unit

  test:integration:
    desc: Run integration tests (needs Docker for testcontainers), coverage in .coverage/integration
    cmds:
      - rm -rf {{.COVERDIR}}/integration && mkdir -p {{.COVERDIR}}/integration
      - go test -tags integration -cover -coverpkg={{.COVERPKG}} {{.INTEGRATION_PKGS}} -args -test.gocoverdir={{.COVERDIR}}/integration

  coverage:
    desc: Merge the unit and integration coverage into .coverage/coverage.out and .coverage/coverage.xml (Cobertura)
    cmds:
      - rm -rf {{.COVERDIR}}/merged && mkdir -p {{.COVERDIR}}/merged
      - |
        inputs=$(for d in unit integration; do [ -d "{{.COVERDIR}}/$d" ] && printf '%s,' "{{.COVERDIR}}/$d"; done)
        if [ -z "$inputs" ]; then echo "no coverage data: run task test and/or task test:integration first" >&2; exit 1; fi
        go tool covdata merge -i="${inputs%,}" -o={{.COVERDIR}}/merged
      - go tool covdata textfmt -i={{.COVERDIR}}/merged -o={{.COVERDIR}}/coverage.out
      - "{{.TOOL}} gocover-cobertura -ignore-gen-files -ignore-dirs '/mock$' < {{.COVERDIR}}/coverage.out > {{.COVERDIR}}/coverage.xml"
      - go tool cover -func={{.COVERDIR}}/coverage.out | tail -1

  serve:
    desc: Build and run the API on localhost:8080 (run `task db:up` first)
    deps: [build]
    cmds:
      - ./bin/homedash serve {{.CLI_ARGS}}

  db:up:
    desc: Start the dev PostgreSQL database
    cmds:
      - "{{.COMPOSE}} up -d --wait postgres"

  db:down:
    desc: Stop the dev PostgreSQL database (data is kept)
    cmds:
      - "{{.COMPOSE}} down"

  db:reset:
    desc: Stop the dev PostgreSQL database and delete its data
    prompt: This deletes all dev data. Continue?
    cmds:
      - "{{.COMPOSE}} down --volumes"

  cobra:add:
    desc: "Scaffold a new CLI command (e.g. task cobra:add -- groceries, or -- list -p groceriesCmd)"
    cmds:
      - go tool -modfile=tools/go.mod cobra-cli add --config .cobra.yaml {{.CLI_ARGS}}

  web:install:
    desc: Install frontend dependencies (exactly as locked in package-lock.json)
    dir: web
    sources: [package.json, package-lock.json]
    cmds:
      - npm ci

  web:dev:
    desc: Run the Vite dev server on http://localhost:5173 (proxies /api to the Go server)
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  web:build:
    desc: Build the frontend into internal/webui/dist (embedded in the binary)
    deps: [web:install]
    sources: ["web/src/**", "web/public/**", web/index.html, "web/*.json", "web/*.ts"]
    generates: ["internal/webui/dist/index.html"]
    cmds:
      - find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
      - npm --prefix web run build

  web:lint:
    desc: Lint the frontend (oxlint)
    dir: web
    deps: [web:install]
    cmds:
      - npm run lint

  web:typecheck:
    desc: Type-check the frontend
    dir: web
    deps: [web:install]
    cmds:
      - npm run typecheck

  web:test:
    desc: Run the frontend tests (Vitest)
    dir: web
    deps: [web:install]
    cmds:
      - npm test

  web:audit:
    desc: Fail on known high or critical vulnerabilities in the frontend's runtime dependencies
    dir: web
    cmds:
      - npm audit --omit=dev --audit-level=high

  web:api:
    desc: Generate the frontend API types (web/src/api/schema.gen.ts) from the Go OpenAPI document
    deps: [web:install]
    cmds:
      - mkdir -p .dev/tmp
      - go run . openapi > .dev/tmp/openapi.json
      - npm --prefix web exec -- openapi-typescript .dev/tmp/openapi.json -o web/src/api/schema.gen.ts

  web:api:check:
    desc: Fail if the frontend API types are out of date with the Go API
    cmds:
      - task: web:api
      - git diff --exit-code -- web/src/api/schema.gen.ts
