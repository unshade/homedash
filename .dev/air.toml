# Live reload for the Go server, used by `task dev:api` (air: https://github.com/air-verse/air).
# Paths are relative to the repository root, where the task runs.
root = "."
tmp_dir = ".dev/tmp"

[build]
  cmd = "go build -o ./.dev/tmp/homedash ."
  entrypoint = ["./.dev/tmp/homedash"]
  args_bin = ["serve"]
  include_ext = ["go"]
  exclude_dir = [".coverage", ".dev", ".git", ".github", "bin", "docs", "internal/webui/dist", "tools", "web"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  # Let the server shut down cleanly (closes the database) before restarting it.
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
